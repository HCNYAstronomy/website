<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCNY December Astronomy Olympiad Training</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lessons.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <p class="identity">HCNY Astronomy</p>
      <h1>HCNY December Astronomy<br class="wide"> Olympiad Training</h1>
    </div>
  </header>
  <main class="wrap">
    <h2 id="materials">Lesson materials</h2>
    <p class="scroll-hint">Scroll the table to see all resources.</p>
    <div class="table-region" role="region" aria-labelledby="materials" tabindex="0">
      <table>
        <thead>
          <tr>
            <th scope="col">Lesson</th>
            <th scope="col">Topic</th>
            <th scope="col">Lesson Recordings</th>
            <th scope="col">Slides</th>
            <th scope="col">Homework</th>
            <th scope="col">Solutions</th>
          </tr>
        </thead>
        <tbody id="lessons">
          <tr><td colspan="6">Loading lessons…</td></tr>
        </tbody>
      </table>
    </div>
    <noscript><p>Enable JavaScript to load lesson materials.</p></noscript>
  </main>
  <footer class="wrap">
    <a href="mailto:hcnyastro@gmail.com">hcnyastro@gmail.com</a>
    <a href="https://github.com/HCNYAstronomy/december-astro-training/edit/main/lessons.json">Edit lessons on GitHub</a>
  </footer>
</body>
</html>
